
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShreeWIN RAM PATIL</title>



<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --halo:#fff8e8;      /* heaven light */
  --gold:#f0c469;
  --gold2:#ffe6ae;
  --ink:#241a12;       /* text on light */
  --ink-soft:#7d6a5c;
  --abyss:#170609;     /* hell dark */
  --abyss2:#2a0a10;
  --crimson:#d21a2b;
  --crimson2:#ff4d4d;
  --ash:#e8cfc9;       /* text on dark */
  --ash-soft:#b9958f;
}
html,body{overflow-x:hidden}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;background:#f6efe4;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px;position:relative;overflow:hidden}
/* heaven above, abyss below */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#fffaf0 0%,#fdf1de 38%,#7a2a22 74%,#1a0609 100%)}
.blooms{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.blooms i{position:absolute;border-radius:50%}
.blooms i:nth-child(1){width:60vw;height:60vw;left:-10%;top:-8%;background:radial-gradient(circle,var(--gold2),transparent 68%);animation:drift1 21s ease-in-out infinite}
.blooms i:nth-child(2){width:50vw;height:50vw;right:-8%;top:2%;background:radial-gradient(circle,#fffdf6,transparent 66%);animation:drift2 25s ease-in-out infinite}
.blooms i:nth-child(3){width:62vw;height:62vw;left:2%;bottom:-16%;background:radial-gradient(circle,#ff3b2e,transparent 66%);animation:drift3 19s ease-in-out infinite}
.blooms i:nth-child(4){width:46vw;height:46vw;right:-4%;bottom:-8%;background:radial-gradient(circle,#8c0f18,transparent 68%);animation:drift1 27s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,7%) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-7%,6%) scale(.92)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(5%,-8%) scale(1.14)}}

/* feathers falling (heaven) + embers rising (hell) */
.motes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.motes s{position:absolute;top:-12px;width:5px;height:5px;border-radius:50%;background:#fff3d0;box-shadow:0 0 9px #ffe9b8;opacity:0;animation:fall linear infinite;list-style:none}
@keyframes fall{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.95}70%{opacity:.6}100%{transform:translateY(46vh) translateX(-18px);opacity:0}}
.motes s:nth-child(1){left:14%;animation-duration:9s;animation-delay:0s}
.motes s:nth-child(2){left:33%;width:4px;height:4px;animation-duration:11s;animation-delay:2.2s}
.motes s:nth-child(3){left:58%;animation-duration:10s;animation-delay:4.4s}
.motes s:nth-child(4){left:79%;width:4px;height:4px;animation-duration:12s;animation-delay:1.5s}
.motes b{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ff5a3c;box-shadow:0 0 10px #ff7a4d;opacity:0;animation:riseUp linear infinite}
@keyframes riseUp{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:1}70%{opacity:.55}100%{transform:translateY(-46vh) translateX(20px);opacity:0}}
.motes b:nth-child(5){left:20%;animation-duration:10s;animation-delay:.8s}
.motes b:nth-child(6){left:44%;width:4px;height:4px;animation-duration:12s;animation-delay:3.1s}
.motes b:nth-child(7){left:68%;animation-duration:9s;animation-delay:5.2s}
.motes b:nth-child(8){left:88%;width:4px;height:4px;animation-duration:13s;animation-delay:2.4s}

/* card: divine top half, infernal bottom half */
.card{position:relative;width:100%;max-width:396px;z-index:2;border-radius:30px;overflow:hidden;text-align:center;
  border:1px solid rgba(255,255,255,.55);
  background:linear-gradient(180deg,rgba(255,252,244,.94) 0%,rgba(255,247,232,.92) 46%,rgba(58,10,16,.95) 58%,rgba(18,5,8,.97) 100%);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 40px 90px -30px rgba(90,10,20,.55),0 12px 30px -12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.9);
  animation:rise .8s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
/* glowing seam where the two worlds meet */
.seam{position:absolute;left:0;right:0;top:52%;height:2px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--gold),#fff,var(--crimson2),transparent);
  box-shadow:0 0 18px rgba(255,190,110,.8),0 0 26px rgba(255,70,60,.6);animation:seam 3.2s ease-in-out infinite}
@keyframes seam{0%,100%{opacity:.7}50%{opacity:1}}

.top{position:relative;z-index:2;padding:32px 26px 8px}
.bottom{position:relative;z-index:2;padding:22px 26px 26px}

.avatar-wrap{position:relative;width:118px;height:118px;margin:0 auto 16px;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.soft-glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.6),rgba(255,70,60,.22) 62%,transparent 76%);filter:blur(8px);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
/* half-gold half-crimson halo */
.ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 200deg,#ffe6ae,#f0c469 25%,#8c0f18 50%,#ff4d4d 72%,#ffe6ae 100%);animation:spin 10s linear infinite;
  -webkit-mask:radial-gradient(transparent 63%,#000 64%);mask:radial-gradient(transparent 63%,#000 64%)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;background-image:url('https://pub-2bd0f7d6f1c24613a7d0b319b559a9cc.r2.dev/profiles/rampatil-caba61bc.webp');background-size:cover;background-position:center;background-color:#f0e6d8;border:4px solid #fff8ec;z-index:2;box-shadow:0 12px 26px -8px rgba(60,10,16,.5)}

h1{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.3px;line-height:1.1;color:var(--ink);margin-bottom:6px}
.underline{width:60px;height:3px;margin:10px auto 12px;border-radius:3px;background:linear-gradient(90deg,#ffe6ae,#f0c469,#d21a2b,#ff4d4d);background-size:200% auto;animation:slide 6s linear infinite}
@keyframes slide{to{background-position:200% center}}
.tagline{font-size:14.5px;font-weight:400;color:var(--ink-soft);line-height:1.55;margin-bottom:16px;padding:0 6px}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;width:100%;
  background:linear-gradient(120deg,#f0c469,#ff8a3d 42%,#d21a2b);background-size:200% auto;
  color:#fff;padding:20px 18px;border-radius:18px;text-decoration:none;font-family:'Outfit',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:.6px;overflow:hidden;
  border:1px solid rgba(255,225,180,.5);
  box-shadow:0 18px 36px -14px rgba(210,26,43,.9),0 0 26px rgba(255,150,80,.35),inset 0 1px 0 rgba(255,255,255,.4);
  animation:flow 6s linear infinite,beat 3.4s ease-in-out infinite;transition:transform .12s ease}
@keyframes flow{to{background-position:200% center}}
@keyframes beat{0%,90%,100%{transform:translateY(0)}95%{transform:translateY(-3px)}}
.cta::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%{left:-80%}60%,100%{left:150%}}
.cta:active{transform:scale(.97)}
.cta-icon{font-size:19px;line-height:1}
.reassure{margin-top:11px;font-size:12px;color:var(--ash-soft);letter-spacing:.2px}

.timer{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,200,150,.18)}
.ring-wrap{position:relative;width:74px;height:74px;flex:none}
.ring-svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(255,210,170,.16);stroke-width:7}
.ring-prog{fill:none;stroke:url(#cg);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 5px rgba(255,120,80,.7))}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:25px;font-weight:700;color:#fff2e2;font-variant-numeric:tabular-nums}
.timer-meta{text-align:left}
.timer-title{font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.timer-sub{font-size:12.5px;color:var(--ash-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:4px 10px;border-radius:20px;background:rgba(255,120,80,.14);border:1px solid rgba(255,140,90,.36);font-size:11px;font-weight:600;color:#ffb894}
.dot{width:6px;height:6px;border-radius:50%;background:#ff6a4d;box-shadow:0 0 8px #ff6a4d;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
